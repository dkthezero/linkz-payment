<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinkZ — Choose Seats</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }
    @media (min-width: 640px) {
      .seat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (min-width: 900px) {
      .seat-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }
    .seat {
      aspect-ratio: 1 / 1.15;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
      position: relative;
      padding: 0.75rem;
    }
    .seat:hover { border-color: var(--brand-400, #818cf8); box-shadow: var(--shadow); }
    .seat.available { border-color: var(--brand-200); }
    .seat.selected { border-color: var(--brand-600); box-shadow: 0 0 0 2px var(--brand-600); }
    .seat.held { opacity: 0.55; cursor: not-allowed; background: var(--gray-50); }
    .seat svg { width: 2rem; height: 2rem; color: var(--gray-700); }
    .seat.selected svg { color: var(--brand-600); }
    .seat.held svg { color: var(--gray-400); }
    .seat-label { font-weight: 700; font-size: 0.9375rem; }
    .seat-price { font-size: 0.8125rem; color: var(--gray-500); }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.875rem;
      color: var(--gray-600);
      margin-bottom: 1rem;
    }
    .legend-item { display: flex; align-items: center; gap: 0.375rem; }
    .swatch { width: 1rem; height: 1rem; border-radius: 0.25rem; border: 1px solid var(--gray-200); }
    .stage {
      background: var(--gray-900);
      color: #fff;
      text-align: center;
      padding: 0.75rem;
      border-radius: var(--radius);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    .split {
      display: grid;
      gap: 1.5rem;
    }
    @media (min-width: 900px) {
      .split { grid-template-columns: 1fr 320px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a href="index.html" class="logo">
        <span class="logo-mark">L</span>
        <span>LinkZ</span>
      </a>
      <div class="user-chip">
        <span>alex.chen@example.com</span>
        <div class="avatar">AC</div>
      </div>
    </header>

    <main>
      <h1 class="page-title">Choose your seats</h1>
      <p class="page-subtitle">Select one or more available seats for your group.</p>

      <div class="split">
        <section>
          <div class="card">
            <div class="stage">STAGE</div>

            <div class="legend">
              <div class="legend-item"><span class="swatch" style="background:#fff;"></span> Available</div>
              <div class="legend-item"><span class="swatch" style="background:var(--brand-50); border-color:var(--brand-600);"></span> Selected</div>
              <div class="legend-item"><span class="swatch" style="background:var(--gray-50);"></span> Held / Occupied</div>
            </div>

            <div class="seat-grid" role="group" aria-label="Seat selection">
              <button class="seat held" disabled aria-label="Seat A1 held">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">A1</span>
                <span class="seat-price">—</span>
              </button>
              <button class="seat available" aria-label="Seat A2 $120">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">A2</span>
                <span class="seat-price">$120</span>
              </button>
              <button class="seat held" disabled aria-label="Seat A3 held">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">A3</span>
                <span class="seat-price">—</span>
              </button>
              <button class="seat available selected" aria-label="Seat A4 selected $120">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">A4</span>
                <span class="seat-price">$120</span>
              </button>
              <button class="seat available" aria-label="Seat B1 $95">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">B1</span>
                <span class="seat-price">$95</span>
              </button>
              <button class="seat available" aria-label="Seat B2 $95">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">B2</span>
                <span class="seat-price">$95</span>
              </button>
              <button class="seat held" disabled aria-label="Seat B3 held">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">B3</span>
                <span class="seat-price">—</span>
              </button>
              <button class="seat available" aria-label="Seat B4 $95">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">B4</span>
                <span class="seat-price">$95</span>
              </button>
              <button class="seat available" aria-label="Seat C1 $80">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">C1</span>
                <span class="seat-price">$80</span>
              </button>
              <button class="seat available" aria-label="Seat C2 $80">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">C2</span>
                <span class="seat-price">$80</span>
              </button>
              <button class="seat available" aria-label="Seat C3 $80">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">C3</span>
                <span class="seat-price">$80</span>
              </button>
              <button class="seat held" disabled aria-label="Seat C4 held">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 1 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Z"/></svg>
                <span class="seat-label">C4</span>
                <span class="seat-price">—</span>
              </button>
            </div>
          </div>
        </section>

        <aside>
          <div class="card" style="position: sticky; top: 5rem;">
            <h2 style="margin-top: 0; font-size: 1.125rem;">Your selection</h2>
            <div class="summary-row">
              <span>Seats</span>
              <strong>A4, A2</strong>
            </div>
            <div class="summary-row">
              <span>Price</span>
              <strong>$240.00</strong>
            </div>
            <div class="summary-row">
              <span>Service fee</span>
              <strong>$4.00</strong>
            </div>
            <div class="summary-row">
              <span>Total</span>
              <span style="color: var(--brand-600);">$244.00</span>
            </div>
            <a href="checkout.html" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
              Proceed to payment
            </a>
          </div>
        </aside>
      </div>
    </main>

    <footer>LinkZ — Seat Reservation Platform</footer>
  </div>
</body>
</html>
